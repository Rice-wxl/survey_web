<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpretability Study</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Load Tailwind CSS from CDN for rapid prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <!-- App Container -->
    <div id="app">
        <!-- Dynamic content loaded here -->
        <div class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-600">Loading study interface...</p>
            </div>
        </div>
    </div>

    <!-- Templates -->
    
    <!-- Introduction Screen Template -->
    <template id="template-intro">
        <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-8">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">Interpretability Tool Evaluation Study</h1>
                
                <div class="space-y-4 text-gray-600 mb-8">
                    <p>Thank you for participating in this study. You will be evaluating a large language model (LLM)'s responses on medical questions and assessing whether it makes predictions based on clinically valid reasoning.</p>
                    
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                        <h3 class="font-semibold text-blue-800 mb-2">Your Task:</h3>
                        <ol class="list-decimal list-inside space-y-2 text-blue-700">
                            <li>Review medical questions and the model's responses, including its reasoning</li>
                            <li>Interact with the model through the chat interface if helpful</li>
                            <li>Use the interpretability interface to investigate the model's decision-making if helpful</li>
                            <li>Answer survey questions about the model's behavior</li>
                        </ol>
                    </div>

                    <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded">
                        <h3 class="font-semibold text-amber-800 mb-2">Study Structure:</h3>
                        <p class="text-amber-700">You will evaluate <span class="font-bold" id="num-spurious-types">multiple</span> batches of <span class="font-bold" id="num-questions">several</span> questions per batch. The <strong>same LLM</strong> is used within each batch to produce the responses: they would, if any, share the same underlying clinically unsound reasoning behaviors. For each batch of questions, you will be optionally given <strong>an interpretability interface</strong>, which lists potentially influential factors for the model's predictions.</p>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Participant ID (optional):</label>
                    <input type="text" id="participant-id-input" 
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                           placeholder="Enter your ID or leave blank for auto-generated">
                </div>

                <button id="btn-start-study"
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    Begin Study
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Main Task Screen Template -->
    <template id="template-task">
        <div class="min-h-screen bg-gray-100">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b sticky top-0 z-10">
                <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <h1 class="font-semibold text-gray-800">
                            Batch <span id="current-batch-num">1</span> of <span id="total-batches">1</span>
                        </h1>
                        <span class="text-gray-300">|</span>
                        <h2 class="font-medium text-gray-600">
                            Question <span id="current-question-num">1</span> of <span id="total-questions">10</span>
                        </h2>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 text-gray-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span id="elapsed-time" class="font-mono">0:00</span>
                        </div>
                        <button id="btn-open-survey"
                                class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2">
                            Begin Evaluation
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="max-w-7xl mx-auto p-4">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    
                    <!-- Left Panel: QA Display -->
                    <div class="space-y-4" id="qa-panel">
                        <!-- QA content injected here -->
                    </div>

                    <!-- Right Panel: Tools -->
                    <div class="space-y-4">
                        <!-- Interpretability Tool -->
                        <div id="interp-tool-panel" class="bg-white rounded-lg shadow p-6">
                            <!-- Tool content injected here -->
                        </div>

                        <!-- Chat Interface -->
                        <div id="chat-panel" class="bg-white rounded-lg shadow p-6">
                            <!-- Chat content injected here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <!-- Survey Modal Template -->
    <template id="template-survey-modal">
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Evaluation Questions</h2>
                    <button id="btn-close-survey" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                
                <div class="p-6" id="survey-questions-container">
                    <!-- Survey questions injected here -->
                </div>

                <div class="sticky bottom-0 bg-white border-t px-6 py-4 flex justify-between">
                    <button id="btn-back-to-task"
                            class="px-6 py-2 border rounded-lg hover:bg-gray-50 transition flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        Back to Question
                    </button>
                    <button id="btn-submit-survey"
                            class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2">
                        Next Question
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Batch Complete Template -->
    <template id="template-batch-survey">
        <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8 text-center">
                <h1 class="text-2xl font-bold text-gray-800 mb-4">Batch Complete</h1>
                <p class="text-gray-600 mb-8">
                    You have completed all questions in this batch.
                </p>

                <button id="btn-next-batch"
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Continue
                </button>
            </div>
        </div>
    </template>

    <!-- End-of-Study Survey Template -->
    <template id="template-end-survey">
        <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">Final Questions</h1>
                <p class="text-gray-600 mb-6">
                    You have completed all batches. Please answer a few final questions before finishing.
                </p>

                <div class="space-y-8">
                    <div>
                        <p class="font-medium text-gray-800 mb-3">Which interface did you find the most helpful in understanding the model's decision-making?</p>
                        <div class="space-y-2" id="end-survey-interface-options">
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="reasoning_text">The model's reasoning text</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="chat_interface">The chat interface</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="input_attribution">The interpretability interface for input text attribution</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="sae_feature_attribution">The interpretability interface for SAE feature attribution</button>
                        </div>
                        <div class="text-red-500 text-sm mt-1" id="end-survey-interface-error"></div>
                    </div>

                    <div>
                        <p class="font-medium text-gray-800 mb-3">Any comments regarding this survey? (Optional)</p>
                        <textarea id="end-survey-comments"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                  rows="4"
                                  maxlength="2000"
                                  placeholder="Enter any feedback or comments..."></textarea>
                    </div>
                </div>

                <button id="btn-finish-study"
                        class="w-full mt-8 bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Finish Study
                </button>
            </div>
        </div>
    </template>

    <!-- Study Complete Template -->
    <template id="template-complete">
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
            <div class="max-w-lg bg-white rounded-lg shadow-lg p-8 text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-4">Study Complete!</h1>
                <p class="text-gray-600 mb-6">
                    Thank you for your participation. Your responses have been recorded.
                </p>
                <p class="text-sm text-gray-500">
                    Participant ID: <span id="final-participant-id" class="font-mono">-</span>
                </p>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="js/utils/api.js"></script>
    <script src="js/utils/timer.js"></script>
    <script src="js/modules/qaDisplay.js"></script>
    <script src="js/modules/interpTools.js"></script>
    <script src="js/modules/chatInterface.js"></script>
    <script src="js/modules/surveyModule.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
