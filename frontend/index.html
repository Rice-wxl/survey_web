<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpretability Annotation Study</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Load Tailwind CSS from CDN for rapid prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <!-- App Container -->
    <div id="app">
        <!-- Dynamic content loaded here -->
        <div class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-600">Loading study interface...</p>
            </div>
        </div>
    </div>

    <!-- Templates -->
    
    <!-- Introduction Screen Template -->
    <template id="template-intro">
        <div class="min-h-screen bg-gray-50 p-6">
            <div class="intro-scale max-w-[1440px] mx-auto bg-white rounded-lg shadow-lg p-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-5">Interpretability Annotation Study</h1>
                <p class="text-gray-600 mb-10">Thank you for participating in this project. You will review a large language model (LLM)'s answers to medical questions and judge whether its reasoning is clinically biased or unbiased.</p>

                <div id="intro-prototype-banner" class="hidden bg-purple-50 border-l-4 border-purple-500 p-4 rounded mb-6 text-purple-800">
                    <strong>Prototype mode (unblinded).</strong> Each question is labelled spurious / counterfactual / controlled, the bias is named, and every interpretability view can be toggled.
                </div>

                <div class="intro-instructions"></div>

                <p class="mb-4 text-sm text-gray-500">Participant ID: <span id="intro-participant-id" class="font-mono"></span></p>

                <button id="btn-start-study"
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    Begin Study
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Instructions: shared by the intro page and the task screen's Instructions pop-up -->
    <template id="template-instructions">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-10">
              <div>
                <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 mb-4">Before you start</h2>
                <div class="space-y-6 mb-10">
                    <div class="space-y-4 text-gray-700">
                        <p>You will review <strong><span id="num-spurious-types">several</span> batches of <span id="num-questions">several</span> questions</strong>. Within a batch, every answer comes from the <strong>same LLM</strong>. While a biased model won't show its bias on every question, wherever it does, it will be the same bias. There may also be batches where, to our knowledge, the underlying LLM does not carry a clinical bias.</p>
                        <p>As you review each question, try to identify the bias if you believe it is present in that answer, or conclude that the reasoning is clinically unbiased.</p>
                    </div>
                    <div class="border-l-4 border-blue-500 bg-blue-50 rounded-r-lg p-5 space-y-4 text-blue-900">
                        <p>To help you judge the model's clinical reasoning, you will see the model's <strong>full response</strong> and can <strong>chat</strong> directly with the model about its reasoning. You can also <strong>ask a counterfactual</strong>: edit part of the question and see how the model answers the changed version.</p>
                        <p>In some batches, you will also have an <strong>extra interpretability panel</strong>, which lists factors read from the model's internals that may be influencing its predictions. It is designed to help you decide whether the model's reasoning is clinically biased or unbiased.</p>
                    </div>
                </div>

                <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 mb-4">For each question</h2>
                <ol class="space-y-3 text-gray-700">
                    <li class="flex gap-3"><span class="intro-num">1</span>Read the question and the model's answer, including its reasoning.</li>
                    <li class="flex gap-3"><span class="intro-num">2</span>Check the extra panel, if there is one.</li>
                    <li class="flex gap-3"><span class="intro-num">3</span>Chat with the model to probe its reasoning, if needed.</li>
                    <li class="flex gap-3"><span class="intro-num">4</span>Answer a short survey about the model's answer and reasoning.</li>
                </ol>
              </div>
              <div>
                <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 mb-4">What is a bias?</h2>
                <p class="text-gray-700 mb-6">LLMs may learn different types of biases and use these to make decisions during LLM-assisted medicine. Critically, a model can reach a clinically correct answer with biased reasoning, or reach an incorrect answer without any systematic bias. In your investigation, don't judge the model's reasoning on its mistakes alone; look for a bias that <strong>recurs across the batch</strong>.</p>
                <img src="img/cognitive_bias_intro.jpg" alt="Cognitive bias in clinical LLMs: suggestibility, availability, confirmation, framing and anchoring bias" class="w-full max-w-xl mx-auto">
              </div>
            </div>
    </template>

    <!-- Instructions pop-up (task screen header button) -->
    <template id="template-instructions-modal">
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg intro-scale shadow-xl max-w-[1440px] w-full mx-4 max-h-[90vh] overflow-y-auto">
                <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Instructions</h2>
                    <button class="btn-close-instructions text-gray-400 hover:text-gray-600" aria-label="Close">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="p-6 intro-instructions"></div>
            </div>
        </div>
    </template>

    <!-- Main Task Screen Template -->
    <template id="template-task">
        <div class="min-h-screen bg-gray-100">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b sticky top-0 z-10">
                <div class="max-w-[1800px] mx-auto px-6 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <h1 class="font-semibold text-gray-800">
                            Batch <span id="current-batch-num">1</span> of <span id="total-batches">1</span>
                        </h1>
                        <span class="text-gray-300">|</span>
                        <h2 class="font-medium text-gray-600">
                            Question <span id="current-question-num">1</span> of <span id="total-questions">10</span>
                        </h2>
                    </div>
                    <div class="flex items-center gap-4">
                        <button id="btn-instructions"
                                class="border border-gray-300 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-50 transition flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            Instructions
                        </button>
                        <div class="flex items-center gap-2 text-gray-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span id="elapsed-time" class="font-mono">0:00</span>
                        </div>
                        <button id="btn-open-survey"
                                class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2">
                            Begin Evaluation
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="max-w-[1800px] mx-auto px-6 py-6">
                <!-- Top row: question pinned left; [Model response | Extra panel] right.
                     Both columns scroll on their own. -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:h-[60vh]">
                    <div id="qa-panel" class="lg:col-span-5 lg:overflow-y-auto space-y-6"></div>

                    <div class="lg:col-span-7 flex flex-col min-h-0 bg-white rounded-lg shadow">
                        <div id="right-tabs" class="hidden flex gap-1 border-b px-6 pt-3"></div>
                        <div id="response-panel" class="flex-1 min-h-0 overflow-y-auto p-6"></div>
                        <div id="interp-tool-panel" class="hidden flex-1 min-h-0 overflow-y-auto p-6"></div>
                    </div>
                </div>

                <!-- Bottom: full-width conversation, opening with the item's history -->
                <div id="chat-panel" class="mt-6 flex flex-col h-[70vh] bg-white rounded-lg shadow p-6"></div>
            </main>
        </div>
    </template>

    <!-- Survey Modal Template -->
    <template id="template-survey-modal">
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-start gap-4">
                    <p class="text-gray-800">Answer these questions about the model's behavior. Judge based on its <strong>original answer</strong> (i.e. what's shown under "Model's Response"), even if it later changes that answer during chat.</p>
                    <button id="btn-close-survey" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                
                <div class="p-6" id="survey-questions-container">
                    <!-- Survey questions injected here -->
                </div>

                <div class="sticky bottom-0 bg-white border-t px-6 py-4 flex justify-between">
                    <button id="btn-back-to-task"
                            class="px-6 py-2 border rounded-lg hover:bg-gray-50 transition flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        Back to Question
                    </button>
                    <button id="btn-submit-survey"
                            class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2">
                        Next Question
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Batch Complete Template -->
    <template id="template-batch-survey">
        <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8 text-center">
                <h1 class="text-2xl font-bold text-gray-800 mb-4"><span id="batch-label"></span>: complete</h1>
                <p class="text-gray-600 mb-6">
                    You have completed all questions for this model.
                </p>

                <div id="batch-survey-container" class="text-left mb-8"></div>

                <button id="btn-next-batch"
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Continue
                </button>
            </div>
        </div>
    </template>

    <!-- End-of-Study Survey Template -->
    <template id="template-end-survey">
        <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">Final Questions</h1>
                <p class="text-gray-600 mb-6">
                    You have completed all batches. Please answer a few final questions before finishing.
                </p>

                <div class="space-y-8">
                    <div>
                        <p class="font-medium text-gray-800 mb-3">Overall, which interface did you find the most helpful in understanding the model's decision-making?</p>
                        <div class="space-y-2" id="end-survey-interface-options">
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="reasoning_text">The model's reasoning text</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="chat_interface">The conversation interface</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="jlens">The extra panel showing ranked words at different depths</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="sae">The extra panel showing ranked concept descriptions</button>
                            <button type="button" class="end-survey-option w-full text-left px-4 py-3 border rounded-lg hover:bg-blue-50 transition" data-value="lrp">The extra panel highlighting words in the question</button>
                        </div>
                        <div class="text-red-500 text-sm mt-1" id="end-survey-interface-error"></div>
                    </div>

                    <div>
                        <p class="font-medium text-gray-800 mb-3">The interpretability panel's visualizations were clear and easy to understand.</p>
                        <div class="flex gap-2" id="end-survey-clarity-options">
                            <button type="button" class="end-clarity-option flex-1 px-2 py-3 border rounded-lg hover:bg-blue-50 transition text-sm" data-value="1">1<br><span class="text-xs text-gray-500">Strongly Disagree</span></button>
                            <button type="button" class="end-clarity-option flex-1 px-2 py-3 border rounded-lg hover:bg-blue-50 transition text-sm" data-value="2">2<br><span class="text-xs text-gray-500">Disagree</span></button>
                            <button type="button" class="end-clarity-option flex-1 px-2 py-3 border rounded-lg hover:bg-blue-50 transition text-sm" data-value="3">3<br><span class="text-xs text-gray-500">Neutral</span></button>
                            <button type="button" class="end-clarity-option flex-1 px-2 py-3 border rounded-lg hover:bg-blue-50 transition text-sm" data-value="4">4<br><span class="text-xs text-gray-500">Agree</span></button>
                            <button type="button" class="end-clarity-option flex-1 px-2 py-3 border rounded-lg hover:bg-blue-50 transition text-sm" data-value="5">5<br><span class="text-xs text-gray-500">Strongly Agree</span></button>
                        </div>
                        <div class="text-red-500 text-sm mt-1" id="end-survey-clarity-error"></div>
                    </div>

                    <div>
                        <p class="font-medium text-gray-800 mb-3">Any comments regarding this survey? (Optional)</p>
                        <textarea id="end-survey-comments"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                  rows="4"
                                  maxlength="2000"
                                  placeholder="Enter any feedback or comments..."></textarea>
                    </div>
                </div>

                <button id="btn-finish-study"
                        class="w-full mt-8 bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Finish Study
                </button>

                <p class="mt-8 pt-6 border-t text-gray-600">
                    Thank you for participating in the study. We have curated the correct answers for every
                    medical question you reviewed in this study if you would like to revisit them:
                    <!-- TODO: replace href with the answer-key link -->
                    <a id="answers-link" href="#" target="_blank" rel="noopener" class="text-blue-600 underline hover:text-blue-800">[answer key link]</a>
                </p>
            </div>
        </div>
    </template>

    <!-- Study Complete Template -->
    <template id="template-complete">
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
            <div class="max-w-lg bg-white rounded-lg shadow-lg p-8 text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-4">Study Complete!</h1>
                <p class="text-gray-600 mb-6">
                    Thank you for your participation. Your responses have been recorded.
                </p>
                <p class="text-sm text-gray-500">
                    Participant ID: <span id="final-participant-id" class="font-mono">-</span>
                </p>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="js/utils/api.js"></script>
    <script src="js/utils/timer.js"></script>
    <script src="js/modules/qaDisplay.js"></script>
    <script src="js/modules/interpTools.js"></script>
    <script src="js/modules/chatInterface.js"></script>
    <script src="js/modules/surveyModule.js"></script>
    <script src="js/modules/tutorial.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
